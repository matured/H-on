<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&family=IBM+Plex+Mono:wght@500&display=swap');

* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  overflow: hidden;
}

#splash-grid {
  display: grid;
  width: 100vw;
  height: 100vh;
  gap: clamp(3px, 0.7vw, 10px);
  padding: clamp(3px, 0.7vw, 10px);
  background: #0a0a0a;
}

.tile {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  background: #faf9f4;
  cursor: pointer;
}
.tile span {
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 900;
  font-size: 11vw;
  line-height: 1;
  color: #0a0a0a;
  transition: color 0.06s linear, transform 0.2s ease;
  user-select: none;
}

.tile.tile-dim span { color: #d8d4c8; }
.tile:hover span { transform: scale(1.1); }

#splash-grid:focus-visible {
  outline: 2px solid #c8102e;
  outline-offset: -4px;
}

@media (prefers-reduced-motion: reduce) {
  .tile span { transition: none; }
  .tile:hover span { transform: none; }
  body.hon-leaving #splash-grid { transition: none; }
}

#hon-caption {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #a8a397;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
  white-space: nowrap;
}
#hon-caption.show { opacity: 1; }

#hon-skip {
  position: fixed;
  bottom: 10px;
  right: 10px;
  padding: 16px;
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6e6a61;
  text-decoration: none;
  z-index: 20;
}
#hon-skip:hover { color: #faf9f4; }

body.hon-leaving #splash-grid {
  transition: opacity 0.5s ease;
  opacity: 0;
}
</style>
</head>
<body>

<div id="splash-grid" role="button" tabindex="0" aria-label="Enter site"></div>
<p id="hon-caption">Click or press any key to enter</p>
<a id="hon-skip" href="catalog.html">Skip &rarr;</a>

<script>
(function () {
  const grid = document.getElementById('splash-grid');
  const caption = document.getElementById('hon-caption');

  const cellTarget = 200; // approx px per tile, used to size the grid
  const cols = Math.max(4, Math.round(window.innerWidth / cellTarget));
  const rows = Math.max(5, Math.round(window.innerHeight / cellTarget));
  const total = cols * rows;

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

  const tiles = [];
  for (let i = 0; i < total; i++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.setAttribute('aria-hidden', 'true'); // decorative — #splash-grid carries the one real action
    const glyph = document.createElement('span');
    glyph.textContent = '本';
    tile.appendChild(glyph);
    tile.addEventListener('click', enterSite);
    grid.appendChild(tile);
    tiles.push(tile);
  }

  // Every tile does the same thing (enter the site), so the grid itself is
  // the one real control — a screen reader / keyboard user gets a single
  // "Enter site" stop instead of tabbing through dozens of identical tiles
  // (kept focusable/labeled below for that reason, even though sighted
  // keyboard users can now just press anything without tabbing first).
  //
  // Document-level, not scoped to the grid, so a keyboard user doesn't have
  // to tab to anything first — matches the "press any key" splash pattern.
  // Modifier combos (Cmd/Ctrl/Alt) are left alone so browser/OS shortcuts
  // (refresh, dev tools, address bar) still work. Tab is left alone so it
  // still moves focus normally — including to the Skip link, which should
  // get to handle its own Enter/Space as a real link, not be raced by this
  // handler firing first.
  document.addEventListener('keydown', (e) => {
    if (document.body.classList.contains('hon-leaving')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Tab') return;
    if (e.target !== document.body && e.target !== grid) return;
    e.preventDefault();
    enterSite();
  });

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Continuous random flicker — no ramp, no single winner.
  // Each cycle dims a handful of random tiles briefly, then schedules
  // the next cycle at a slightly randomized interval for an organic feel.
  // Skipped entirely under prefers-reduced-motion (grid stays static).
  function flicker() {
    const burst = 2 + Math.floor(Math.random() * 4); // 2–5 tiles per cycle
    for (let i = 0; i < burst; i++) {
      const idx = Math.floor(Math.random() * total);
      const tile = tiles[idx];
      tile.classList.add('tile-dim');
      setTimeout(() => tile.classList.remove('tile-dim'), 90 + Math.random() * 160);
    }
    const nextIn = 90 + Math.random() * 220;
    setTimeout(flicker, nextIn);
  }

  function enterSite() {
    document.body.classList.add('hon-leaving');
    setTimeout(() => { window.location.href = 'catalog.html'; }, prefersReducedMotion ? 0 : 480);
  }

  if (!prefersReducedMotion) flicker();
  setTimeout(() => caption.classList.add('show'), 900);
})();
</script>

</body>
</html>
