<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin · 本 (hon)</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>

  <section style="padding-bottom: 20px; padding-top: clamp(64px, 9vw, 108px);">
    <div class="wrap">
      <p class="eyebrow">ADMIN</p>
      <h1 style="font-size: clamp(32px, 5vw, 54px); margin-top:16px;">Library administration.</h1>
      <p class="serif-lede" style="max-width: 56ch; margin-top:18px;">
        Issue cards, close out loans, and suspend accounts. Only shows up in
        the nav for admin accounts — access is gated server-side by the
        is_admin flag on your account, not by this page being hard to find.
      </p>
    </div>
  </section>

  <hr class="rule">

  <section>
    <div class="wrap" id="admin-root">
      <p class="eyebrow">CHECKING ACCESS&hellip;</p>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/circulation.js"></script>
<script src="js/main.js"></script>
<script>
const HON_LABEL_STYLE = 'display:block; font-family:var(--mono); font-size:11px; letter-spacing:0.1em; font-weight:600; text-transform:uppercase; color:var(--grey); margin-bottom:6px;';
const HON_TH_STYLE = 'text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--grey); padding:8px 10px; border-bottom:1px solid var(--line-strong);';
const HON_TD_STYLE = 'padding:10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;';
const HON_INPUT_STYLE = 'width:100%; font-family:var(--mono); font-size:13px; padding:10px 12px; border:1px solid var(--ink); background:var(--paper);';
// Must match the `limit` in admin_list_waitlist() (supabase/migrations/20260821000000_admin_list_waitlist.sql).
const HON_WAITLIST_ROW_CAP = 500;
const HON_CATALOG_FIELD_IDS = ['cf-id', 'cf-title', 'cf-subtitle', 'cf-issue', 'cf-era', 'cf-genre', 'cf-call', 'cf-coverbg', 'cf-coverfg', 'cf-coveraccent', 'cf-desc'];
// item_id doubles as a Storage path segment ({item_id}/{side}.{ext} in
// honUploadCoverImage) — lowercase-slug-only keeps it a safe, predictable
// object key instead of free text that could contain "/" or "..".
const HON_ITEM_ID_PATTERN = /^[a-z0-9]+(-[a-z0-9]+)*$/;
// Uploaded image URLs live here, not in a text input — set by the file
// upload handlers or by honFillCatalogForm when editing an existing title.
let honCatalogImageState = { coverImage: undefined, backImage: undefined };

async function honRenderAdmin() {
  const root = document.getElementById('admin-root');
  const user = await honGetCurrentUser();

  if (!user) {
    root.innerHTML = `
      <p class="eyebrow">SIGNED OUT</p>
      <h2 style="font-size: clamp(22px, 2.8vw, 28px); margin-top:14px;">Sign in first.</h2>
      <p style="margin-top:12px; font-size:15px; color:#2c2b28;">This page needs an admin session.</p>
      <a href="membership.html" class="btn" style="margin-top:20px; display:inline-flex;">Go to Sign In &rarr;</a>
    `;
    return;
  }

  let profile;
  try {
    profile = await honFetchMyProfile();
  } catch (err) {
    root.innerHTML = `<p class="eyebrow">ERROR</p><p style="margin-top:12px;">Couldn’t check admin status: ${honEscape(err.message || err)}</p>`;
    return;
  }

  if (!profile || !profile.is_admin) {
    root.innerHTML = `
      <p class="eyebrow">NOT AUTHORIZED</p>
      <h2 style="font-size: clamp(22px, 2.8vw, 28px); margin-top:14px;">This account isn’t an admin.</h2>
      <a href="catalog.html" class="btn" style="margin-top:20px; display:inline-flex;">Back to the Archive &rarr;</a>
    `;
    return;
  }

  root.innerHTML = `
    <div style="margin-bottom:48px;">
      <p class="eyebrow">ISSUE A CARD</p>
      <h2 style="font-size: clamp(20px, 2.6vw, 24px); margin-top:12px;">Mint an extra invite.</h2>
      <p style="margin-top:10px; font-size:14.5px; color:#2c2b28;">Attributed to your own account — it’ll also show up on your card dashboard on the Membership page.</p>
      <button class="btn btn-solid" id="issue-card-btn" style="margin-top:16px;">Issue Card &rarr;</button>
      <p id="issue-card-status" role="status" aria-live="polite" style="margin-top:10px; font-size:14px;"></p>
    </div>

    <div style="margin-bottom:48px;">
      <p class="eyebrow">ACTIVE LOANS</p>
      <div id="loans-table-wrap" style="margin-top:16px; overflow-x:auto;">Loading&hellip;</div>
    </div>

    <div style="margin-bottom:48px;">
      <p class="eyebrow">MEMBERS</p>
      <div id="members-table-wrap" style="margin-top:16px; overflow-x:auto;">Loading&hellip;</div>
    </div>

    <div style="margin-bottom:48px;">
      <p class="eyebrow">WAITLIST</p>
      <p style="margin-top:10px; font-size:14.5px; color:#2c2b28;">People who asked to be on the list from the Membership page. Accept mints a card and shows the code here — copy it and send it to them yourself, no email goes out automatically.</p>
      <div id="waitlist-table-wrap" style="margin-top:16px; overflow-x:auto;">Loading&hellip;</div>
    </div>

    <div>
      <p class="eyebrow">CATALOG</p>
      <h2 style="font-size: clamp(20px, 2.6vw, 24px); margin-top:12px;">Add or edit a title.</h2>
      <p style="margin-top:10px; font-size:14.5px; color:#2c2b28;">Click Edit on a row below to load it here, or fill this in fresh to add a new title.</p>
      <div id="catalog-form" style="margin-top:20px; max-width:900px;">
        <div class="hon-form-group">
          <div class="hon-form-group-label">Details</div>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:14px;">
            <div><label for="cf-id" style="${HON_LABEL_STYLE}">Item ID (slug)</label><input id="cf-id" name="cf-id" autocomplete="off" style="${HON_INPUT_STYLE}"></div>
            <div><label for="cf-title" style="${HON_LABEL_STYLE}">Title</label><input id="cf-title" name="cf-title" autocomplete="off" style="${HON_INPUT_STYLE}"></div>
            <div><label for="cf-subtitle" style="${HON_LABEL_STYLE}">Subtitle</label><input id="cf-subtitle" name="cf-subtitle" autocomplete="off" style="${HON_INPUT_STYLE}"></div>
            <div><label for="cf-issue" style="${HON_LABEL_STYLE}">Issue</label><input id="cf-issue" name="cf-issue" autocomplete="off" style="${HON_INPUT_STYLE}"></div>
            <div><label for="cf-era" style="${HON_LABEL_STYLE}">Era (year)</label><input id="cf-era" name="cf-era" autocomplete="off" style="${HON_INPUT_STYLE}"></div>
            <div><label for="cf-genre" style="${HON_LABEL_STYLE}">Genre</label><input id="cf-genre" name="cf-genre" autocomplete="off" style="${HON_INPUT_STYLE}"></div>
            <div><label for="cf-call" style="${HON_LABEL_STYLE}">Call Number</label><input id="cf-call" name="cf-call" autocomplete="off" style="${HON_INPUT_STYLE}"></div>
            <div><label for="cf-copies" style="${HON_LABEL_STYLE}">Copies</label><input id="cf-copies" name="cf-copies" autocomplete="off" type="number" min="1" value="1" style="${HON_INPUT_STYLE}"></div>
          </div>
          <div style="margin-top:14px;"><label for="cf-desc" style="${HON_LABEL_STYLE}">Description</label><textarea id="cf-desc" name="cf-desc" autocomplete="off" rows="3" style="width:100%; font-family:var(--serif); font-size:14px; padding:10px 12px; border:1px solid var(--ink); background:var(--paper); resize:vertical;"></textarea></div>
        </div>

        <div class="hon-form-group">
          <div class="hon-form-group-label">Cover Style</div>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:14px;">
            <div><label for="cf-coverbg" style="${HON_LABEL_STYLE}">Cover BG (hex)</label><div class="hon-swatch-field"><div class="hon-swatch" id="cf-coverbg-swatch"></div><input id="cf-coverbg" name="cf-coverbg" autocomplete="off" style="${HON_INPUT_STYLE}"></div></div>
            <div><label for="cf-coverfg" style="${HON_LABEL_STYLE}">Cover FG (hex)</label><div class="hon-swatch-field"><div class="hon-swatch" id="cf-coverfg-swatch"></div><input id="cf-coverfg" name="cf-coverfg" autocomplete="off" style="${HON_INPUT_STYLE}"></div></div>
            <div><label for="cf-coveraccent" style="${HON_LABEL_STYLE}">Cover Accent (hex)</label><div class="hon-swatch-field"><div class="hon-swatch" id="cf-coveraccent-swatch"></div><input id="cf-coveraccent" name="cf-coveraccent" autocomplete="off" style="${HON_INPUT_STYLE}"></div></div>
          </div>
        </div>

        <div class="hon-form-group">
          <div class="hon-form-group-label">Images</div>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:14px;">
            <div>
              <label for="cf-coverimage-file" style="${HON_LABEL_STYLE}">Cover Image (front)</label>
              <input type="file" accept="image/*" id="cf-coverimage-file" class="hon-file-input">
              <div id="cf-coverimage-preview" class="hon-image-frame">No Image</div>
            </div>
            <div>
              <label for="cf-backimage-file" style="${HON_LABEL_STYLE}">Back Image</label>
              <input type="file" accept="image/*" id="cf-backimage-file" class="hon-file-input">
              <div id="cf-backimage-preview" class="hon-image-frame">No Image</div>
            </div>
          </div>
        </div>
      </div>
      <div style="margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-solid" id="catalog-save-btn">Save Title &rarr;</button>
        <button class="btn" id="catalog-clear-btn" type="button">New / Clear</button>
        <p id="catalog-form-status" role="status" aria-live="polite" style="font-size:14px; margin:0;"></p>
      </div>
      <div id="catalog-table-wrap" style="margin-top:28px; overflow-x:auto;">Loading&hellip;</div>
    </div>
  `;

  document.getElementById('issue-card-btn').addEventListener('click', async () => {
    const btn = document.getElementById('issue-card-btn');
    const statusEl = document.getElementById('issue-card-status');
    btn.disabled = true;
    btn.textContent = 'Issuing…';
    try {
      const card = await honAdminIssueCard();
      statusEl.textContent = `New code: ${card.code}`;
      statusEl.style.color = 'var(--ink)';
    } catch (err) {
      statusEl.textContent = `Couldn’t issue a card: ${err.message || err}`;
      statusEl.style.color = 'var(--red)';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Issue Card →';
    }
  });

  await honRenderLoansTable();
  await honRenderMembersTable();
  await honRenderWaitlistTable();
  await honRenderCatalogSection();
}

function honCatalogFormToItem() {
  return {
    id: document.getElementById('cf-id').value.trim(),
    title: document.getElementById('cf-title').value.trim(),
    subtitle: document.getElementById('cf-subtitle').value.trim() || undefined,
    issue: document.getElementById('cf-issue').value.trim(),
    era: document.getElementById('cf-era').value.trim(),
    genre: document.getElementById('cf-genre').value.trim(),
    call: document.getElementById('cf-call').value.trim(),
    copiesTotal: parseInt(document.getElementById('cf-copies').value, 10),
    coverBg: document.getElementById('cf-coverbg').value.trim(),
    coverFg: document.getElementById('cf-coverfg').value.trim(),
    coverAccent: document.getElementById('cf-coveraccent').value.trim(),
    coverImage: honCatalogImageState.coverImage,
    backImage: honCatalogImageState.backImage,
    desc: document.getElementById('cf-desc').value.trim(),
  };
}

function honRenderImagePreview(previewId, url) {
  const el = document.getElementById(previewId);
  const alt = previewId.includes('back') ? 'Back cover preview' : 'Front cover preview';
  el.innerHTML = url ? `<img src="${url}" alt="${alt}">` : 'No Image';
}

// Hex swatch fields (Cover BG/FG/Accent) — the swatch is decorative feedback
// only, so an invalid/incomplete hex just leaves the last valid color
// showing rather than needing its own validation path.
const HON_SWATCH_FIELDS = [['cf-coverbg', 'cf-coverbg-swatch'], ['cf-coverfg', 'cf-coverfg-swatch'], ['cf-coveraccent', 'cf-coveraccent-swatch']];

function honUpdateSwatch(inputId, swatchId) {
  document.getElementById(swatchId).style.background = document.getElementById(inputId).value.trim();
}

function honUpdateAllSwatches() {
  HON_SWATCH_FIELDS.forEach(([inputId, swatchId]) => honUpdateSwatch(inputId, swatchId));
}

function honFillCatalogForm(item) {
  document.getElementById('cf-id').value = item.id;
  document.getElementById('cf-id').disabled = true; // item_id is the primary key — don't let an edit silently become a new row
  document.getElementById('cf-title').value = item.title;
  document.getElementById('cf-subtitle').value = item.subtitle || '';
  document.getElementById('cf-issue').value = item.issue;
  document.getElementById('cf-era').value = item.era;
  document.getElementById('cf-genre').value = item.genre;
  document.getElementById('cf-call').value = item.call;
  document.getElementById('cf-copies').value = item.copiesTotal;
  document.getElementById('cf-coverbg').value = item.coverBg;
  document.getElementById('cf-coverfg').value = item.coverFg;
  document.getElementById('cf-coveraccent').value = item.coverAccent;
  document.getElementById('cf-desc').value = item.desc;
  honCatalogImageState = { coverImage: item.coverImage, backImage: item.backImage };
  honRenderImagePreview('cf-coverimage-preview', item.coverImage);
  honRenderImagePreview('cf-backimage-preview', item.backImage);
  honUpdateAllSwatches();
  document.getElementById('catalog-form-status').textContent = '';
}

function honClearCatalogForm() {
  HON_CATALOG_FIELD_IDS.forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('cf-id').disabled = false;
  document.getElementById('cf-copies').value = '1';
  document.getElementById('cf-coverimage-file').value = '';
  document.getElementById('cf-backimage-file').value = '';
  honCatalogImageState = { coverImage: undefined, backImage: undefined };
  honRenderImagePreview('cf-coverimage-preview', undefined);
  honRenderImagePreview('cf-backimage-preview', undefined);
  HON_SWATCH_FIELDS.forEach(([, swatchId]) => { document.getElementById(swatchId).style.background = ''; });
  document.getElementById('catalog-form-status').textContent = '';
}

async function honHandleCoverFileChange(side, storageSlot, fileInputId, previewId) {
  const fileInput = document.getElementById(fileInputId);
  const file = fileInput.files[0];
  if (!file) return;
  const itemId = document.getElementById('cf-id').value.trim();
  if (!itemId) {
    document.getElementById(previewId).textContent = 'Enter the Item ID first, then choose an image.';
    fileInput.value = '';
    return;
  }
  if (!HON_ITEM_ID_PATTERN.test(itemId)) {
    document.getElementById(previewId).textContent = 'Item ID can only use lowercase letters, numbers, and hyphens (e.g. burst-vol15).';
    fileInput.value = '';
    return;
  }
  document.getElementById(previewId).textContent = 'Uploading…';
  try {
    const url = await honUploadCoverImage(itemId, side, file);
    honCatalogImageState[storageSlot] = url;
    honRenderImagePreview(previewId, url);
  } catch (err) {
    document.getElementById(previewId).textContent = `Upload failed: ${err.message || err}`;
  }
}

function honRenderCatalogTable() {
  const wrap = document.getElementById('catalog-table-wrap');
  if (!HON_CATALOG.length) {
    wrap.innerHTML = `<p style="font-size:14px; color:var(--grey);">No titles yet.</p>`;
    return;
  }
  wrap.innerHTML = `
    <table style="width:100%; border-collapse:collapse; min-width:560px;">
      <thead><tr>
        <th style="${HON_TH_STYLE}">ID</th>
        <th style="${HON_TH_STYLE}">Title</th>
        <th style="${HON_TH_STYLE}">Issue</th>
        <th style="${HON_TH_STYLE}">Genre</th>
        <th style="${HON_TH_STYLE}">Copies</th>
        <th style="${HON_TH_STYLE}"></th>
      </tr></thead>
      <tbody>
        ${HON_CATALOG.map(item => `
          <tr>
            <td style="${HON_TD_STYLE} font-family:var(--mono);">${honEscape(item.id)}</td>
            <td style="${HON_TD_STYLE}">${honEscape(item.title)}</td>
            <td style="${HON_TD_STYLE}">${honEscape(item.issue)}</td>
            <td style="${HON_TD_STYLE}">${honEscape(item.genre)}</td>
            <td style="${HON_TD_STYLE}">${item.copiesTotal}</td>
            <td style="${HON_TD_STYLE}"><button class="btn" data-edit-id="${honEscape(item.id)}" style="font-size:12px; padding:8px 12px;">Edit</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('button[data-edit-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = HON_CATALOG.find(i => i.id === btn.dataset.editId);
      if (item) honFillCatalogForm(item);
      document.getElementById('catalog-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });
}

async function honRenderCatalogSection() {
  try {
    await honFetchCatalog();
  } catch (err) {
    document.getElementById('catalog-table-wrap').innerHTML = `<p style="color:var(--red); font-size:14px;">Couldn’t load the catalog: ${honEscape(err.message || err)}</p>`;
    return;
  }
  honRenderCatalogTable();

  document.getElementById('cf-coverimage-file').addEventListener('change', () =>
    honHandleCoverFileChange('front', 'coverImage', 'cf-coverimage-file', 'cf-coverimage-preview'));
  document.getElementById('cf-backimage-file').addEventListener('change', () =>
    honHandleCoverFileChange('back', 'backImage', 'cf-backimage-file', 'cf-backimage-preview'));

  HON_SWATCH_FIELDS.forEach(([inputId, swatchId]) =>
    document.getElementById(inputId).addEventListener('input', () => honUpdateSwatch(inputId, swatchId)));

  document.getElementById('catalog-clear-btn').addEventListener('click', honClearCatalogForm);

  document.getElementById('catalog-save-btn').addEventListener('click', async () => {
    const btn = document.getElementById('catalog-save-btn');
    const statusEl = document.getElementById('catalog-form-status');
    const item = honCatalogFormToItem();
    const required = ['id', 'title', 'issue', 'era', 'genre', 'call', 'coverBg', 'coverFg', 'coverAccent', 'desc'];
    if (required.some(k => !item[k]) || !item.copiesTotal || item.copiesTotal < 1) {
      statusEl.textContent = 'Fill in all fields except subtitle and the two images.';
      statusEl.style.color = 'var(--red)';
      return;
    }
    if (!HON_ITEM_ID_PATTERN.test(item.id)) {
      statusEl.textContent = 'Item ID can only use lowercase letters, numbers, and hyphens (e.g. burst-vol15).';
      statusEl.style.color = 'var(--red)';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await honAdminUpsertItem(item);
      await honFetchCatalog();
      honRenderCatalogTable();
      statusEl.textContent = `Saved "${item.title}".`;
      statusEl.style.color = 'var(--ink)';
    } catch (err) {
      statusEl.textContent = `Couldn’t save: ${err.message || err}`;
      statusEl.style.color = 'var(--red)';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Title →';
    }
  });
}

async function honRenderLoansTable() {
  const wrap = document.getElementById('loans-table-wrap');
  let loans;
  try {
    loans = await honAdminListLoans();
  } catch (err) {
    wrap.innerHTML = `<p style="color:var(--red); font-size:14px;">Couldn’t load loans: ${honEscape(err.message || err)}</p>`;
    return;
  }
  if (!loans.length) {
    wrap.innerHTML = `<p style="font-size:14px; color:var(--grey);">No active loans.</p>`;
    return;
  }
  const now = Date.now();
  wrap.innerHTML = `
    <table style="width:100%; border-collapse:collapse; min-width:640px;">
      <thead><tr>
        <th style="${HON_TH_STYLE}">Item</th>
        <th style="${HON_TH_STYLE}">Member</th>
        <th style="${HON_TH_STYLE}">Checked Out</th>
        <th style="${HON_TH_STYLE}">Due</th>
        <th style="${HON_TH_STYLE}"></th>
      </tr></thead>
      <tbody>
        ${loans.map(l => {
          const overdue = new Date(l.due_at).getTime() < now;
          return `
            <tr>
              <td style="${HON_TD_STYLE} font-family:var(--mono);">${honEscape(l.item_id)}</td>
              <td style="${HON_TD_STYLE}">${honEscape(l.user_email)}</td>
              <td style="${HON_TD_STYLE}">${honFormatDate(l.checked_out_at)}</td>
              <td style="${HON_TD_STYLE} ${overdue ? 'color:var(--red); font-weight:600;' : ''}">${honFormatDate(l.due_at)}${overdue ? ' · OVERDUE' : ''}</td>
              <td style="${HON_TD_STYLE}"><button class="btn" data-loan-id="${l.loan_id}" style="font-size:12px; padding:8px 12px;">Force Return</button></td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('button[data-loan-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Returning…';
      try {
        await honAdminForceReturn(btn.dataset.loanId);
        await honRenderLoansTable();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Failed — retry?';
        btn.title = err.message || String(err);
      }
    });
  });
}

async function honRenderMembersTable() {
  const wrap = document.getElementById('members-table-wrap');
  let profiles;
  try {
    profiles = await honAdminListProfiles();
  } catch (err) {
    wrap.innerHTML = `<p style="color:var(--red); font-size:14px;">Couldn’t load members: ${honEscape(err.message || err)}</p>`;
    return;
  }
  wrap.innerHTML = `
    <table style="width:100%; border-collapse:collapse; min-width:600px;">
      <thead><tr>
        <th style="${HON_TH_STYLE}">Email</th>
        <th style="${HON_TH_STYLE}">Joined</th>
        <th style="${HON_TH_STYLE}">Role</th>
        <th style="${HON_TH_STYLE}">Status</th>
        <th style="${HON_TH_STYLE}"></th>
      </tr></thead>
      <tbody>
        ${profiles.map(p => `
          <tr>
            <td style="${HON_TD_STYLE}">${honEscape(p.email)}</td>
            <td style="${HON_TD_STYLE}">${honFormatDate(p.created_at)}</td>
            <td style="${HON_TD_STYLE}">${p.is_admin ? 'Admin' : 'Member'}</td>
            <td style="${HON_TD_STYLE} ${p.banned ? 'color:var(--red);' : ''}">${p.banned ? 'Banned' : 'Active'}</td>
            <td style="${HON_TD_STYLE}"><button class="btn" data-user-id="${p.user_id}" data-banned="${p.banned}" style="font-size:12px; padding:8px 12px;">${p.banned ? 'Unban' : 'Ban'}</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('button[data-user-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const nextBanned = btn.dataset.banned !== 'true';
      btn.disabled = true;
      btn.textContent = nextBanned ? 'Banning…' : 'Unbanning…';
      try {
        await honAdminSetBanned(btn.dataset.userId, nextBanned);
        await honRenderMembersTable();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Failed — retry?';
        btn.title = err.message || String(err);
      }
    });
  });
}

async function honRenderWaitlistTable() {
  const wrap = document.getElementById('waitlist-table-wrap');
  let requests;
  try {
    requests = await honAdminListWaitlist();
  } catch (err) {
    wrap.innerHTML = `<p style="color:var(--red); font-size:14px;">Couldn’t load the waitlist: ${honEscape(err.message || err)}</p>`;
    return;
  }
  if (!requests.length) {
    wrap.innerHTML = `<p style="font-size:14px; color:var(--grey);">No requests yet.</p>`;
    return;
  }
  // admin_list_waitlist() caps at 500 rows (see the migration) so an
  // unbounded flood of anon submissions can't blow up this render. That cap
  // must never be silent — hitting it exactly means older requests exist
  // beyond what's shown, which is exactly the scenario a spammed public
  // form produces.
  const cappedNote = requests.length === HON_WAITLIST_ROW_CAP
    ? `<p style="margin-bottom:10px; font-size:13px; color:var(--red);">Showing the ${HON_WAITLIST_ROW_CAP} most recent requests — older requests exist beyond this limit.</p>`
    : '';
  const HON_WAITLIST_STATUS_LABEL = { pending: 'Pending', accepted: 'Accepted', declined: 'Declined' };
  const HON_WAITLIST_STATUS_STYLE = { pending: '', accepted: '', declined: 'color:var(--grey);' };

  wrap.innerHTML = `
    ${cappedNote}
    <table style="width:100%; border-collapse:collapse; min-width:760px;">
      <thead><tr>
        <th style="${HON_TH_STYLE}">Name</th>
        <th style="${HON_TH_STYLE}">Email</th>
        <th style="${HON_TH_STYLE}">Note</th>
        <th style="${HON_TH_STYLE}">Submitted</th>
        <th style="${HON_TH_STYLE}">Status</th>
        <th style="${HON_TH_STYLE}"></th>
      </tr></thead>
      <tbody>
        ${requests.map(r => `
          <tr>
            <td style="${HON_TD_STYLE} overflow-wrap:break-word; max-width:220px;">${honEscape(r.name)}</td>
            <td style="${HON_TD_STYLE} overflow-wrap:break-word; max-width:220px;">${honEscape(r.email)}</td>
            <td style="${HON_TD_STYLE} white-space:normal; overflow-wrap:break-word; max-width:360px;">${r.note ? honEscape(r.note) : '<span style="color:var(--grey);">—</span>'}</td>
            <td style="${HON_TD_STYLE}">${honFormatDate(r.created_at)}</td>
            <td style="${HON_TD_STYLE} ${HON_WAITLIST_STATUS_STYLE[r.status] || ''}" class="hon-waitlist-status">${honEscape(HON_WAITLIST_STATUS_LABEL[r.status] || r.status)}</td>
            <td style="${HON_TD_STYLE}" class="hon-waitlist-actions">
              ${r.status === 'pending' ? `
                <div style="display:flex; gap:8px;">
                  <button class="btn btn-solid" data-accept-id="${r.id}" style="font-size:12px; padding:8px 12px;">Accept</button>
                  <button class="btn" data-decline-id="${r.id}" style="font-size:12px; padding:8px 12px;">Decline</button>
                </div>
              ` : '<span style="color:var(--grey);">—</span>'}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  // Accepting mints a card the same way the "Issue Card" button above does
  // (admin_accept_waitlist_request wraps admin_issue_card's own logic),
  // attributed to this admin — it's not linked back to the request row in
  // the database, so the code is only ever shown here, once, right after
  // acceptance. There's no automatic email; copy it and send it to the
  // person yourself, same as every other card issued from this page.
  wrap.querySelectorAll('button[data-accept-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      const declineBtn = row.querySelector('button[data-decline-id]');
      btn.disabled = true;
      if (declineBtn) declineBtn.disabled = true;
      btn.textContent = 'Accepting…';
      try {
        const card = await honAdminAcceptWaitlistRequest(btn.dataset.acceptId);
        row.querySelector('.hon-waitlist-status').textContent = 'Accepted';
        row.querySelector('.hon-waitlist-actions').innerHTML = `Card issued: <strong>${honEscape(card.code)}</strong>`;
      } catch (err) {
        btn.disabled = false;
        if (declineBtn) declineBtn.disabled = false;
        btn.textContent = 'Failed — retry?';
        btn.title = err.message || String(err);
      }
    });
  });

  wrap.querySelectorAll('button[data-decline-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const row = btn.closest('tr');
      const acceptBtn = row.querySelector('button[data-accept-id]');
      btn.disabled = true;
      if (acceptBtn) acceptBtn.disabled = true;
      btn.textContent = 'Declining…';
      try {
        await honAdminDeclineWaitlistRequest(btn.dataset.declineId);
        row.querySelector('.hon-waitlist-status').textContent = 'Declined';
        row.querySelector('.hon-waitlist-status').style.color = 'var(--grey)';
        row.querySelector('.hon-waitlist-actions').innerHTML = '<span style="color:var(--grey);">—</span>';
      } catch (err) {
        btn.disabled = false;
        if (acceptBtn) acceptBtn.disabled = false;
        btn.textContent = 'Failed — retry?';
        btn.title = err.message || String(err);
      }
    });
  });
}

document.addEventListener('DOMContentLoaded', honRenderAdmin);
</script>
</body>
</html>
